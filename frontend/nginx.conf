# Nginx dentro del contenedor del frontend: sirve el build estatico de Vite (dist/).
# El TLS y el dominio publico los maneja el Nginx del servidor (reverse proxy), no este.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Usado por el Health Check del pipeline de Jenkins.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Los assets de Vite llevan hash en el nombre: se pueden cachear sin limite.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA con React Router: cualquier ruta desconocida devuelve index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
